<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMP Card Assistant</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<h1>SMP Card Assistant</h1>
<p class="hint">Тестовый прототип для ProMed. Не сохраняет карту и не отправляет данные автоматически.</p>
<label for="reason">Причина обращения</label>
<select id="reason">
<option>Несчастный случай</option><option selected>Острое внезапное заболевание</option><option>Роды (вне МО)</option><option>Обострение хронического заболевания</option><option>Патология беременности</option><option>Медицинская эвакуация экстренная</option><option>Дежурство при угрозе ЧС</option><option>Дежурство на мероприятии</option><option>Другое</option><option>Плановая перевозка</option><option>Платная мед.услуга</option>
</select>
<label for="complaints">Жалобы</label><textarea id="complaints" rows="3" placeholder="Оставь пустым, если менять не нужно"></textarea>
<label for="anamnez">Анамнез</label><textarea id="anamnez" rows="3" placeholder="Оставь пустым, если менять не нужно"></textarea>
<div class="checkrow"><input id="fillReason" type="checkbox" checked><label for="fillReason">Заполнить причину обращения</label></div>
<div class="checkrow"><input id="fillComplaints" type="checkbox"><label for="fillComplaints">Заполнить жалобы (если введены)</label></div>
<div class="checkrow"><input id="fillAnamnez" type="checkbox"><label for="fillAnamnez">Заполнить анамнез (если введён)</label></div>
<label for="epidemic">Эпидемиологический анамнез</label><textarea id="epidemic" rows="2" placeholder="Оставь пустым, если менять не нужно"></textarea>
<div class="checkrow"><input id="fillEpidemic" type="checkbox"><label for="fillEpidemic">Заполнить эпидемиологический анамнез</label></div>
<label for="allergy">Аллергия</label><select id="allergy"><option value="unchanged" selected>Не менять</option><option value="no">Нет</option><option value="yes">Да</option></select>
<label for="foreignTrip">Выезд за пределы территории</label><select id="foreignTrip"><option value="unchanged" selected>Не менять</option><option value="no">Нет</option><option value="yes">Да</option></select>
<label for="villageTrip">Выезд в село</label><select id="villageTrip"><option value="unchanged" selected>Не менять</option><option value="no">Нет</option><option value="yes">Да</option></select>
<label for="infectionContact">Контакт с инфекционными больными</label><select id="infectionContact"><option value="unchanged" selected>Не менять</option><option value="no">Нет</option><option value="yes">Да</option></select>
<label for="lowQualityProducts">Употребление некачественных продуктов</label>
<select id="lowQualityProducts"><option value="unchanged" selected>Не менять</option><option value="Нет">Нет</option><option value="Да">Да</option></select>
<label for="generalCondition">Общее состояние</label>
<select id="generalCondition"><option value="unchanged" selected>Не менять</option><option>Удовлетворительное</option><option>Средней степени тяжести</option><option>Тяжёлое</option><option>Агональное</option><option>Клиническая смерть</option><option>Биологическая смерть</option></select>
<label for="behavior">Поведение</label>
<select id="behavior"><option value="unchanged" selected>Не менять</option><option>Спокойное</option><option>Возбуждённое</option><option>Агрессивное</option><option>Депрессивное</option><option>Эмоционально лабилен</option></select>
<label for="bodyPosition">Положение тела</label>
<select id="bodyPosition"><option value="unchanged" selected>Не менять</option><option>Активное</option><option>Пассивное</option><option>Вынужденное</option></select>
<button id="fill">Заполнить выбранные поля</button><button id="inspect" class="secondary">Проверить основные поля</button><button id="scanFields" class="secondary">Исследовать поля и флажки</button>
<pre id="status" role="status">Открой карту вызова ProMed и нажми «Проверить поля ProMed».</pre>
<p class="warning">Тестируй на учебной карте. Проверь каждое поле вручную. Кнопку сохранения карты нажимай сам.</p>
</main><script src="popup.js"></script></body></html>
